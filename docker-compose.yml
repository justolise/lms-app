services:
  # ─── PostgreSQL Primary Database ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: lms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-lms}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-lms}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lms_network

  # ─── Redis In-Memory Cache & Rate Limiting ─────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: lms_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lms_network

  # ─── Database Auto-Migrator (Runs on launch, then exits) ───────────────────
  migrator:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: lms_migrator
    command: ["node", "dist/database/migrate.js"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-lms}
      MIGRATION_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-lms}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lms_network

  # ─── NestJS Monolithic API Backend ─────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: lms_api
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-lms}
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-this-in-production-access-secret-32-chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-this-in-production-refresh-secret-32-chars}
      PLATFORM_JWT_ACCESS_SECRET: ${PLATFORM_JWT_ACCESS_SECRET:-change-this-platform-access-secret-32-chars}
      PLATFORM_JWT_REFRESH_SECRET: ${PLATFORM_JWT_REFRESH_SECRET:-change-this-platform-refresh-secret-32-chars}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-01234567890123456789012345678901}
      MEMBER_ID_ENCRYPTION_KEY: ${MEMBER_ID_ENCRYPTION_KEY:-01234567890123456789012345678901}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3001,http://127.0.0.1:3001}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health/live"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - lms_network

  # ─── Next.js App Router Web Frontend ───────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: lms_web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/"]
      interval: 20s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - lms_network

volumes:
  postgres_data:
    name: lms_postgres_data
  redis_data:
    name: lms_redis_data

networks:
  lms_network:
    name: lms_network
    driver: bridge
